name: Explorer tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Renderer and documentation MCP test dependencies
        run: python3 -m pip install -r requirements.txt -r search/requirements-docs.txt
      - name: Build metadata regressions
        run: python3 -m unittest discover -s tests -v
      - name: Browser script syntax
        run: |
          node --check web/explore.js
          node --check web/explore-search.js
          node --check web/cg-pilot.js
