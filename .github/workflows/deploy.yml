# Build and deploy nla-lib.org: the homepage (the files at the top of this repository) and the
# explorer (explore/, built from NLAlib's latest extracted data), as one GitHub Pages site.
#
# NLAlib's `explore` workflow publishes explore-data.json on its rolling `explore-data` release
# after every push, then sends a `nlalib-updated` repository_dispatch here (when the
# EXPLORE_DISPATCH_TOKEN secret is set in NLAlib). The daily schedule is a fallback in case a
# dispatch is missed.
name: Deploy nla-lib.org

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [nlalib-updated]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Markdown page dependencies
        run: python3 -m pip install -r explore/requirements.txt
      - name: Fetch the library data
        working-directory: explore
        run: |
          mkdir -p data
          curl -fsSL -o data/explore-data.json \
            https://github.com/NLA-lib/NLAlib/releases/download/explore-data/explore-data.json
          sha=$(python3 -c "import json; print(json.load(open('data/explore-data.json'))['commit'] or 'scaffold')")
          echo "NLAlib commit: $sha"
          # Keep the complete matching snapshot: guides can link to design documents
          # and other repository files in addition to Lean modules.
          mkdir -p data/src
          curl -fsSL "https://codeload.github.com/NLA-lib/NLAlib/tar.gz/$sha" |
            tar xz -C data/src --strip-components=1
          if [ -f data/src/docs/references.bib ]; then
            cp data/src/docs/references.bib data/references.bib
          fi
      - name: Fetch the rename maps
        # docs/renames/*.json (CONTRIBUTING N12): old #d/ links redirect, changed statements are noted;
        # a commit without the directory builds without maps
        working-directory: explore
        run: |
          if [ -d data/src/docs/renames ]; then
            mkdir -p data/renames-src/docs
            cp -a data/src/docs/renames data/renames-src/docs/renames
          fi
      - name: Build the explorer into _site/explore
        working-directory: explore
        run: |
          renames=""
          if [ -d data/renames-src/docs/renames ]; then renames="--renames data/renames-src/docs/renames"; fi
          module_map=""
          if [ -f data/renames-src/docs/renames/2026-11-ops-modules.json ]; then
            module_map="--module-map data/renames-src/docs/renames/2026-11-ops-modules.json"
          fi
          python3 build.py --data data/explore-data.json --bib data/references.bib --src data/src \
            --out ../_site/explore $renames $module_map
      - name: Add the homepage
        # everything at the top of the repository except the explorer's source, as before the move
        run: rsync -a --exclude .git --exclude .github --exclude explore --exclude _site ./ _site/
      - uses: actions/configure-pages@v5
      # one artifact name per attempt: a re-run would otherwise find two "github-pages" artifacts
      - id: upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # Pass the upload's immutable artifact ID directly to the Pages API.
      # deploy-pages' internal artifact listing can return an empty result even
      # when the upload is visible through GitHub's public artifact API.
      - id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId) || !Number.isSafeInteger(Number(artifactId))) {
              throw new Error('Missing or invalid Pages artifact ID');
            }
            const { owner, repo } = context.repo;
            const oidcToken = await core.getIDToken();
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments', {
                owner, repo, artifact_id: Number(artifactId),
                pages_build_version: context.sha, oidc_token: oidcToken
              }
            );
            core.setOutput('page_url', deployment.page_url);
            const deploymentId = deployment.id || deployment.status_url.split('/').pop();
            let succeeded = false;
            try {
              const deadline = Date.now() + 600000;
              while (Date.now() < deadline) {
                await new Promise(resolve => setTimeout(resolve, 5000));
                const { data } = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                  { owner, repo, deployment_id: deploymentId }
                );
                core.info(`Pages deployment: ${data.status}`);
                if (data.status === 'succeed') {
                  succeeded = true;
                  break;
                }
                if (['deployment_failed', 'deployment_content_failed',
                     'deployment_cancelled', 'deployment_lost'].includes(data.status)) {
                  throw new Error(`Pages deployment failed: ${data.status}`);
                }
              }
              if (!succeeded) throw new Error('Pages deployment timed out');
            } finally {
              if (!succeeded) {
                await github.request(
                  'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
                  { owner, repo, deployment_id: deploymentId }
                ).catch(error => core.warning(`Could not cancel deployment: ${error.message}`));
              }
            }
