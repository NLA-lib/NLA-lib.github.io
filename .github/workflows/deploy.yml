# Build and deploy nla-lib.org: the homepage (the files at the top of this repository) and the
# explorer (explore/, built from NLAlib's latest extracted data), as one GitHub Pages site.
#
# NLAlib's `explore` workflow publishes explore-data.json on its rolling `explore-data` release
# after every push, then sends a `nlalib-updated` repository_dispatch here (when the
# EXPLORE_DISPATCH_TOKEN secret is set in NLAlib). The daily schedule is a fallback in case a
# dispatch is missed.
name: Deploy nla-lib.org

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [nlalib-updated]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Markdown page dependencies
        run: python3 -m pip install -r explore/requirements.txt
      - name: Fetch the library data
        working-directory: explore
        run: |
          mkdir -p data
          curl -fsSL -o data/explore-data.json \
            https://github.com/NLA-lib/NLAlib/releases/download/explore-data/explore-data.json
          sha=$(python3 -c "import json; print(json.load(open('data/explore-data.json'))['commit'] or 'scaffold')")
          echo "NLAlib commit: $sha"
          curl -fsSL -o data/references.bib \
            "https://raw.githubusercontent.com/NLA-lib/NLAlib/$sha/docs/references.bib" || true
          # the library source at that commit, for the bodies of definitions
          mkdir -p data/src
          curl -fsSL "https://codeload.github.com/NLA-lib/NLAlib/tar.gz/$sha" |
            tar xz -C data/src --strip-components=1 --wildcards '*/NLAlib/*' '*/NLAlib.lean' '*/docs/targets.toml' '*/lean-toolchain'
      - name: Fetch the rename maps
        # docs/renames/*.json (CONTRIBUTING N12): old #d/ links redirect, changed statements are noted;
        # a commit without the directory builds without maps
        working-directory: explore
        run: |
          sha=$(python3 -c "import json; print(json.load(open('data/explore-data.json'))['commit'] or 'scaffold')")
          mkdir -p data/renames-src
          curl -fsSL "https://codeload.github.com/NLA-lib/NLAlib/tar.gz/$sha" |
            tar xz -C data/renames-src --strip-components=1 --wildcards '*/docs/renames/*' || true
      - name: Build the explorer into _site/explore
        working-directory: explore
        run: |
          renames=""
          if [ -d data/renames-src/docs/renames ]; then renames="--renames data/renames-src/docs/renames"; fi
          python3 build.py --data data/explore-data.json --bib data/references.bib --src data/src \
            --out ../_site/explore $renames
      - name: Add the homepage
        # everything at the top of the repository except the explorer's source, as before the move
        run: rsync -a --exclude .git --exclude .github --exclude explore --exclude _site ./ _site/
      - uses: actions/configure-pages@v5
      # one artifact name per attempt: a re-run would otherwise find two "github-pages" artifacts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
